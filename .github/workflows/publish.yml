name: Publish to npm
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Authenticates to npm via trusted publishing (OIDC). No npm token involved.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm >= 11.5.1. Node 22 still bundles npm 10.x,
          # so stay on 24, which bundles npm 11.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      # Inject the version from the tag. Rewriting package.json before npm ci
      # would fail its integrity check against package-lock.json, so keep this order.
      - run: npm pkg set version="${GITHUB_REF_NAME}"
      - run: npm run build
      # Provenance is generated automatically under trusted publishing,
      # so --provenance is not needed here.
      - run: npm publish
